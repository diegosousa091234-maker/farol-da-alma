<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAROL DA ALMA - Inteligente</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020610;color:#fff;font-family:Arial;display:flex;justify-content:center}
.c{width:100%;max-width:460px;background:#08152a;min-height:100vh;border:1px solid #1a2a4a;display:flex;flex-direction:column}
.top{text-align:center;padding:20px}
.top h1{color:#FFD700;font-size:26px;letter-spacing:4px;text-shadow:0 0 20px #FFD700}
.tower{font-size:40px;margin:10px;filter:drop-shadow(0 0 15px #FFD700)}
.chat{flex:1;margin:12px;background:#020610;border:1px solid rgba(255,215,0,.2);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;padding:12px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;max-height:400px}
.msg{padding:10px 12px;border-radius:12px;font-size:12px;line-height:1.4;max-width:85%}
.bot{background:rgba(255,215,0,.12);border:1px solid rgba(255,215,0,.2);align-self:flex-start}
.user{background:#FFD700;color:#000;align-self:flex-end;font-weight:700}
.input{display:flex;gap:8px;padding:10px;background:#080c18;border-top:1px solid rgba(255,215,0,.2)}
.input input{flex:1;background:#020610;border:1px solid #1a2a4a;border-radius:20px;padding:10px 14px;color:#fff;outline:none}
.input button{background:#FFD700;border:none;border-radius:20px;padding:10px 16px;font-weight:900;cursor:pointer}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px}
.card{background:rgba(12,22,48,.9);border:1px solid rgba(255,215,0,.25);border-radius:12px;padding:10px;cursor:pointer;text-align:center}
.card b{color:#FFD700;font-size:10px;display:block}
.card span{font-size:8px;color:#888}
.live{text-align:center;padding:12px;color:#00ff88;font-size:10px;letter-spacing:2px}
</style>
</head>
<body>
<div class="c">
<div class="top"><h1>FAROL DA ALMA</h1><div class="tower">🗼</div><p style="font-size:9px;color:#7a8aaa;letter-spacing:2px">SISTEMA INTELIGENTE • CLIQUE OU PERGUNTE</p></div>

<div class="cards">
<div class="card" onclick="perguntar('segurança')"><b>🛡️ SEGURANÇA</b><span>status</span></div>
<div class="card" onclick="perguntar('sabedoria')"><b>💡 SABEDORIA</b><span>oráculo</span></div>
<div class="card" onclick="perguntar('coração estável')"><b>❤️ CORAÇÃO</b><span>acalmia</span></div>
<div class="card" onclick="perguntar('coragem')"><b>🛡️ CORAGEM</b><span>força</span></div>
</div>

<div class="chat">
<div class="msgs" id="msgs">
<div class="msg bot">🔥 Olá! Eu sou a Inteligência do Farol da Alma. Toque nos pilares acima ou digite sua pergunta. Estou ONLINE.</div>
</div>
<div class="input">
<input id="q" placeholder="Pergunte algo ao Farol..." onkeypress="if(event.key==='Enter')enviar()">
<button onclick="enviar()">➤</button>
</div>
</div>

<div class="live">● INTELIGÊNCIA ATIVA • LIVE • farol-da-alma.onrender.com</div>
</div>

<script>
async function perguntar(txt){
  addMsg(txt,'user');
  document.getElementById('q').value='';
  const res = await fetch('/api/oraculo/'+encodeURIComponent(txt));
  const data = await res.json();
  addMsg(data.resposta,'bot');
}
async function enviar(){
  const v=document.getElementById('q').value;
  if(!v) return;
  perguntar(v);
}
function addMsg(t,cls){
  const m=document.createElement('div');
  m.className='msg '+cls;
  m.innerText=t;
  document.getElementById('msgs').appendChild(m);
  document.getElementById('msgs').scrollTop=9999;
}
</script>
</div>
</body>
</html>
