<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farol da Alma - Diagrama</title>
<style>
body{background:#0a0a0a;color:#FFD700;font-family:Arial, sans-serif;text-align:center;padding:15px;margin:0}
h1{color:#FFD700;text-shadow:0 0 20px #FFD700;font-size:28px;margin-top:30px}
.box{border:2px solid #FFD700;border-radius:24px;padding:25px;max-width:480px;margin:25px auto;background:#111;box-shadow:0 0 40px rgba(255,215,0,.35)}
.dot{width:22px;height:22px;background:#FFD700;border-radius:50%;margin:10px auto;box-shadow:0 0 20px #FFD700}
.line{width:3px;height:32px;background:linear-gradient(#FFD700,#b8860b);margin:0 auto}
.card{background:#1e1e1e;border:1px solid #FFD700;border-radius:14px;padding:14px;margin:12px 0;font-size:16px}
small{color:#c5a000;display:block;margin-top:4px}
.status{margin-top:25px;font-weight:bold}
.live{color:#00ff00;text-shadow:0 0 10px #00ff00}
</style>
</head>
<body>
<h1>✨ FAROL DA ALMA ✨</h1>
<p>DIAGRAMA ARQUITETÔNICO VIVO</p>

<div class="box">
<div class="dot"></div>
<div class="line"></div>

<div class="card">🧠 MEMÓRIA VIVA<br><small>Guarda sua jornada e aprendizados</small></div>
<div class="line"></div>

<div class="card">🔐 PORTAL SEGURO<br><small>Autenticação protegida</small></div>
<div class="line"></div>

<div class="card">🌟 LINGUAGEM ÚNICA<br><small>Cada alma se expressa de forma única</small></div>
<div class="line"></div>

<div class="dot"></div>

<div class="status">SISTEMA ONLINE E ATIVO<br><span class="live">● LIVE</span></div>
</div>

<p style="color:#666;font-size:12px;margin-top:30px">farol-da-alma.onrender.com<br>Atualizado agora</p>
</body>
</html>
