<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Farol da Alma</title>
<style>
body{margin:0;font-family:system-ui;background:#0f172a;color:#fff;text-align:center}
.hero{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;background:radial-gradient(circle at center,#1e3a5f,#0f172a)}
h1{font-size:3rem;color:#facc15;margin:0}
p{color:#cbd5e1;max-width:600px;font-size:1.2rem;margin:15px}
.btn{margin-top:20px;padding:16px 32px;background:#facc15;color:#0f172a;border:none;border-radius:30px;font-weight:bold;font-size:1.1rem}
.card{background:#1e293b;margin:12px auto;padding:20px;border-radius:14px;max-width:500px;font-size:1.1rem}
</style>
</head>
<body>
<div class="hero">
<h1>🔦 Farol da Alma</h1>
<p>Quando tudo parece escuro, existe uma luz dentro de você esperando pra brilhar.</p>
<button class="btn" onclick="alert('✨ Sua luz foi acesa!')">Acender meu Farol</button>
</div>
<div style="padding:30px 15px">
<div class="card">🌟 Propósito - Descubra o que move sua alma</div>
<div class="card">💙 Acolhimento - Você não está sozinho</div>
<div class="card">🚀 Recomeço - Seu novo capítulo começa agora</div>
</div>
</body>
</html>
